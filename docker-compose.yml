services:
  zos-postgres:
    image: postgres:16-alpine
    container_name: zos-postgres
    environment:
      POSTGRES_USER: zoder_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: zoder_db
    volumes:
      - /mnt/data/ssd/zoder-pgdata:/var/lib/postgresql/data
    ports:
      - "5440:5432"
    networks:
      - homelab-net
      - zoder-net
    restart: unless-stopped

  zoder-minio:
    image: minio/minio:latest
    container_name: zoder-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - /mnt/data/ssd/zoder-minio-data:/data
    ports:
      - "8097:9000"
      - "8098:9001"
    networks:
      - homelab-net
      - zoder-net
    restart: unless-stopped

  zoder:
    build: .
    image: zoder-app:latest
    container_name: zoder-app
    environment:
      DATABASE_URL: postgresql://zoder_user:${POSTGRES_PASSWORD}@zos-postgres:5432/zoder_db
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: production
      MINIO_ENDPOINT: zoder-minio
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
    ports:
      - "8101:3000"
    networks:
      - homelab-net
      - zoder-net
    depends_on:
      - zos-postgres
      - zoder-minio
    restart: unless-stopped

networks:
  homelab-net:
    external: true
  zoder-net:
    driver: bridge
